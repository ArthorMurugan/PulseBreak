name: Build Debug APK & Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next version
        id: version
        run: |
          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Extract version numbers
          VERSION_NUM=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
          MINOR=$(echo $VERSION_NUM | cut -d. -f2)
          PATCH=$(echo $VERSION_NUM | cut -d. -f3)
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists on current commit
        id: check_tag
        run: |
          if git describe --exact-match --tags HEAD 2>/dev/null; then
            echo "Tag already exists on this commit"
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "No tag on current commit"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Find and copy universal APK
        run: |
          mkdir -p release-apks
          # Look for universal.apk in build outputs
          find app/build/outputs -name "*universal*.apk" -type f -exec cp {} release-apks/universal.apk \;
          # If no universal.apk found, copy any available apk
          if [ ! -f release-apks/universal.apk ]; then
            find app/build/outputs -name "*.apk" -type f | head -1 | xargs -I {} cp {} release-apks/universal.apk
          fi
          ls -la release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-apk
          path: release-apks/universal.apk

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create git tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git tag ${{ steps.version.outputs.new_version }}
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Create Release with universal.apk
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          files: release-apks/universal.apk
          body: |
            ## PulseBreak ${{ steps.version.outputs.new_version }}
            
            ### Release Files
            - **universal.apk** - Universal APK for all Android architectures
            
            **Installation:** 
            Download the universal.apk file and install on your Android device
            
            Auto-generated release
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
